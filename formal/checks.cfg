[options]
isa rv32i
nret 1
solver bitwuzla

[depth]
insn            20
reg       15    25
pc_fwd    10    30
pc_bwd    10    30
liveness  1  10 30
unique    1  10 30
causal    10    30
ill             20
cover     1     15

[sort]
reg_ch0

[defines]
`define RISCV_FORMAL_ALIGNED_MEM

[verilog-files]
@basedir@/cores/@core@/wrapper.sv

[script-sources]
plugin -i slang
read_slang --top pipeline @basedir@/cores/@core@/rtl/pkg.sv @basedir@/cores/@core@/rtl/alu.sv @basedir@/cores/@core@/rtl/branch_control.sv @basedir@/cores/@core@/rtl/branch_gen.sv @basedir@/cores/@core@/rtl/control_unit.sv @basedir@/cores/@core@/rtl/forward_control.sv @basedir@/cores/@core@/rtl/hazard_detection.sv @basedir@/cores/@core@/rtl/imm_gen.sv @basedir@/cores/@core@/rtl/pc.sv @basedir@/cores/@core@/rtl/reg_file.sv @basedir@/cores/@core@/rtl/pipeline.sv

[cover]
always @* if (!reset) cover (channel[0].cnt_insns == 2);
